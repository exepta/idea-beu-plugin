plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
}

group = 'com.tiltus.beu.parser'
version = findProperty('pluginVersion') ?: '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    intellijPlatform {
        rustRover('2026.1')
    }
}

intellijPlatform {
    pluginConfiguration {
        name = 'Bevy HTML Support'

        ideaVersion {
            sinceBuild = '261'
        }
    }
}
